# Include from the build's private MAKECONF, never copy over /etc/mk.conf.
# This profile is a candidate until its native and image acceptance gates pass.
.if defined(BSD_PKG_MK)
PKG_OPTIONS.gcc16= gcc-c++ always-libgcc -nls -gcc-inplace-math \
    -gcc-fortran -gcc-objc -gcc-objc++ -gcc-cobol -gcc-go -gcc-graphite
MAKE_JOBS= 1
# Avoid default debug information multiplying the compiler build footprint.
CFLAGS= -O2
CXXFLAGS= -O2
.endif
