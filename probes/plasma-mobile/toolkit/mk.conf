# Include from a staging build's private MAKECONF. Final prefix: /usr/pkg.
# Include EMBERBSD-COMMON-TOOLS-MK.CONF before this file.
.if defined(BSD_PKG_MK)
GCC_REQD+= 16.2
PKGSRC_COMPILER= gcc
MAKE_JOBS= 1
CFLAGS= -O2
CXXFLAGS= -O2
# Do not accept the base X11 OpenGL libraries or pkgsrc's amber Mesa fallback.
USE_BUILTIN.MesaLib= no
USE_BUILTIN.glu= no
BUILDLINK_API_DEPENDS.MesaLib+= MesaLib>=26.2.4
BUILDLINK_ABI_DEPENDS.MesaLib+= MesaLib>=26.2.4
.if !defined(EMBERBSD_COMMON_TOOLS)
PKG_FAIL_REASON+= "The Plasma toolkit requires the common build-tools profile"
.endif
# These two candidate recipes still name ffmpeg8. Remove this blocker only
# with their coordinated FFmpeg 9 recipe/buildlink/PLIST migration.
.if ${PKGPATH:U} == "multimedia/qt6-qtmultimedia" || \
    ${PKGPATH:U} == "sysutils/kf6-kfilemetadata" || \
    !empty(PKGPATH:Mmultimedia/ffmpeg[3-8])
PKG_FAIL_REASON+= "The common FFmpeg 9 package integration is pending; refusing the old media dependency"
.endif
.if ${PKGPATH:U} == "graphics/MesaLib" && ${DISTNAME:U} != "mesa-26.2.4"
PKG_FAIL_REASON+= "The common Mesa 26.2.4 package integration is pending; refusing the old Mesa recipe"
.endif
.endif
